# One-command build → push → deploy to Cloud Run (the same flow as greenfield).
#
#   gcloud builds submit --substitutions=_GA_ID=G-XXXXXXXXXX
#
# Prereqs (one-time):
#   • an Artifact Registry docker repo (default name below: "web")
#       gcloud artifacts repositories create web --repository-format=docker --location=us-east1
#   • the Resend key in Secret Manager
#       printf '%s' 're_xxx' | gcloud secrets create RESEND_API_KEY --data-file=-
#   • the tawk.to webhook secret + ClickUp API token, same way
#       printf '%s' 'xxx'    | gcloud secrets create TAWK_WEBHOOK_SECRET --data-file=-
#       printf '%s' 'pk_xxx' | gcloud secrets create CLICKUP_API_TOKEN --data-file=-
#   • grant the Cloud Run runtime SA access to that secret (Secret Manager Secret Accessor)

substitutions:
  _REGION: us-east1
  _SERVICE: conductor-website
  _REPO: web
  _GA_ID: "" # pass at submit time: --substitutions=_GA_ID=G-XXXXXXXXXX
  _TAWK_PROPERTY_ID: "" # tawk.to live chat — blank disables the widget
  _TAWK_WIDGET_ID: "default"
  _CLICKUP_LIST_ID: "" # ClickUp Support Inbox list id

steps:
  # 1 · build the image (GA id is baked in here — NEXT_PUBLIC_* is build-time)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_GA_ID=${_GA_ID}
      - --build-arg
      - NEXT_PUBLIC_TAWK_PROPERTY_ID=${_TAWK_PROPERTY_ID}
      - --build-arg
      - NEXT_PUBLIC_TAWK_WIDGET_ID=${_TAWK_WIDGET_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2 · push
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3 · deploy to Cloud Run (runtime env + secrets)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=CONTACT_TO_EMAIL=support@conductor.ng,CONTACT_FROM_EMAIL=Conductor site <noreply@conductor.ng>,CLICKUP_SUPPORT_LIST_ID=${_CLICKUP_LIST_ID}
      - --set-secrets=RESEND_API_KEY=RESEND_API_KEY:latest,TAWK_WEBHOOK_SECRET=TAWK_WEBHOOK_SECRET:latest,CLICKUP_API_TOKEN=CLICKUP_API_TOKEN:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
